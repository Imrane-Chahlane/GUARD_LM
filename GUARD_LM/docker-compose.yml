services:
  postgres:
    image: postgres:16-alpine
    container_name: guard_lm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guard_lm
    ports:
      - "5432:5432"
    volumes:
      - guard_lm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guard_lm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guard_lm_postgres_data:
